## YAML Template.
---
server:
  port: 8083
  
# Database connection
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_app
    username: root
    password: root
       
# JPA and Hibernate configuration
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
  security:
    
    # oauth2 configuration
    oauth2:
      client:
        registration:
          google: 
            client-id: ${GOOGLE_CLIENT_ID:30220700444-18kieddo4vkbtv7ktpi18p7n1pngku8m.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            # /login/oauth2/code/google
            scope:
              - email
              - profile
              - openid
          github:
             client_id: ${GITHUB_CLIENT_ID:Ov23liSZfRM1vu5xqreD}
             client-secret: ${GITHUB_CLIENT_SECRET:3fcb10a1ee9be69303807f17feb44cc93b02216e}
             # /login/oauth2/code/github
             scope:
               - user:email
               - read:user
      
logging:
  level:
    org.springframework.security: DEBUG
    com.example.authentication: DEBUG
    org.hibernate.SQL: DEBUG

security:
  jwt:
    secret: K8vN2xQ7mP4zL9aR6tY3wE1sD5fG8hJ2kM7nB4cV9xZ6pQ3rT8yU1iO5aS7dF0gH
    issuer: ${JWT_ISSUER:api.com.example}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:600}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}
    refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
    cookie-http-only: ${JWT_COOKIE_HTTP_ONLY:true}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:lax}
    cookie-domain: ${JWT_COOKIE_DOMAIN:localhost}
    
app:
  cors:
    front-end-url: "http://localhost:5173"
  auth:
    frontend:
      success-redirect: "http://localhost:5173/oauth/success"
      failure-redirect: "http://localhost:5173/oauth/failure"
      
      